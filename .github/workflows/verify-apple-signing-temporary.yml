name: Verify shared Apple signing (temporary)

# Usage: push this exact branch, or rerun its check after changing secret scope.
# This is a credential check, not a product build or release. Remove before merge.
on:
  push:
    branches: [docs/shared-apple-signing]
    paths: [.github/workflows/verify-apple-signing-temporary.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'cats-inc/cats-platform' || github.repository == 'cats-inc/cats-bots'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Verify Developer ID signing and notarization authentication
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import secrets
          import subprocess
          import tempfile
          from pathlib import Path

          names = ["CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_API_KEY_P8_BASE64", "APPLE_API_KEY_ID", "APPLE_API_ISSUER"]
          if any(not os.environ.get(name) for name in names):
              raise SystemExit("Incomplete signing credentials")
          if not re.fullmatch(r"[A-Z0-9]{10}", os.environ["APPLE_API_KEY_ID"]):
              raise SystemExit("Invalid notarization key ID format")
          if not re.fullmatch(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", os.environ["APPLE_API_ISSUER"]):
              raise SystemExit("Invalid notarization issuer format")

          def run(label, args, data=None):
              # Never print argv/stderr: security import receives the P12 password.
              try:
                  result = subprocess.run(args, input=data, capture_output=True, timeout=120)
              except (OSError, subprocess.TimeoutExpired):
                  raise SystemExit(label + " could not complete") from None
              if result.returncode:
                  raise SystemExit(label + " failed")
              return result.stdout.decode("utf-8", errors="replace")

          with tempfile.TemporaryDirectory(prefix="apple-signing-check-", dir=os.environ["RUNNER_TEMP"]) as directory:
              root = Path(directory)
              cert = root / "identity.p12"
              api_key = root / "notarization.p8"
              keychain = str(root / "verification.keychain-db")
              keychain_password = secrets.token_urlsafe(32)
              try:
                  for target, name in [(cert, "CSC_LINK"), (api_key, "APPLE_API_KEY_P8_BASE64")]:
                      target.write_bytes(base64.b64decode("".join(os.environ[name].split()), validate=True))
                      target.chmod(0o600)
              except (ValueError, OSError):
                  raise SystemExit("Could not decode signing credentials") from None
              try:
                  run("Create isolated keychain", ["security", "create-keychain", "-p", keychain_password, keychain])
                  run("Unlock isolated keychain", ["security", "unlock-keychain", "-p", keychain_password, keychain])
                  run("Import Developer ID", ["security", "import", str(cert), "-k", keychain, "-P", os.environ["CSC_KEY_PASSWORD"], "-T", "/usr/bin/codesign", "-T", "/usr/bin/security"])
                  run("Allow codesign", ["security", "set-key-partition-list", "-S", "apple-tool:,apple:,codesign:", "-s", "-k", keychain_password, keychain])
                  identities = run("Find valid signing identity", ["security", "find-identity", "-v", "-p", "codesigning", keychain])
                  match = re.search(r'([0-9A-F]{40}) "Developer ID Application:', identities)
                  if not match:
                      raise SystemExit("No valid Developer ID Application identity")
                  probe = str(root / "signing-probe")
                  run("Compile signing probe", ["clang", "-x", "c", "-o", probe, "-"], b"int main(void) { return 0; }\n")
                  run("Sign probe", ["codesign", "--force", "--options", "runtime", "--timestamp=none", "--keychain", keychain, "--sign", match.group(1), probe])
                  run("Verify signed probe", ["codesign", "--verify", "--strict", probe])
                  print("Developer ID private key imported; native signing and signature verification passed.")
                  # Read-only authentication check; no app is submitted to Apple.
                  run("Notarization authentication", ["xcrun", "notarytool", "history", "--key", str(api_key), "--key-id", os.environ["APPLE_API_KEY_ID"], "--issuer", os.environ["APPLE_API_ISSUER"], "--output-format", "json"])
                  print("Apple notarization API authentication passed.")
              finally:
                  subprocess.run(["security", "delete-keychain", keychain], capture_output=True, timeout=30)
          print("Temporary keychain and credential files removed; no artifacts published.")
          PY
