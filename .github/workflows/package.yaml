name: Package

# SPEC-002 FR-9 / ADR-002 §6: every main update builds the Windows installer
# and the portable exe and keeps them as a workflow artifact. Publishing a
# GitHub Release stays with the release SOP and the owner's authorization.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package installer and portable exe
        run: npm run dist:win

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cats-bot-windows-${{ github.sha }}
          path: |
            release/*-setup-*.exe
            release/*-portable-*.exe
          if-no-files-found: error
          retention-days: 30
