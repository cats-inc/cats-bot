name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ADR-001 §9 / PLAN-005: test and package on each supported platform.
  # Keep the required check names stable. Tests run `.ts` files directly through
  # Node 24 type stripping, so the source stays limited to erasable syntax.
  node:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build candidate packages (updates disabled)
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/build-preview.mjs --platform "$RELEASE_PLATFORM" --tag "$tag" --source "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/*-build.json
          if-no-files-found: error

  preview-contract:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "runtime=$(node -p 'require("./vendor/runtime-source.json").commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: cats-inc/cats-runtime
          ref: ${{ steps.pin.outputs.runtime }}
          path: runtime-source
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete candidate assets and source bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/create-source-bundle.py "$SOURCE_COMMIT" runtime-source release-assets
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { validateInputs, validateAssets } from './scripts/release-contract.mjs';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const input = await validateInputs(process.cwd(), `v${pkg.version}`);
          await validateAssets('release-assets', input, process.env.SOURCE_COMMIT, true);
          JS

  validate:
    # This existing required check also gates every platform's package contract.
    needs: [node, preview-contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and the combined package contract
        env:
          NODE_RESULT: ${{ needs.node.result }}
          CONTRACT_RESULT: ${{ needs.preview-contract.result }}
        run: test "$NODE_RESULT" = success && test "$CONTRACT_RESULT" = success
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate YAML files
        # Every tracked YAML file must parse; one parse error fails the job.
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import subprocess
          import sys

          import yaml

          listed = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8")
          paths = [path for path in listed.split("\0") if path]
          failures = 0
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as error:
                  failures += 1
                  print(f"Invalid: {path}: {error}", file=sys.stderr)
              else:
                  print(f"Valid: {path}")
          print(f"Checked {len(paths)} YAML file(s), {failures} invalid")
          sys.exit(1 if failures else 0)
          PY
