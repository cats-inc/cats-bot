name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Match the other Cats repos: detect documentation-only changes inside the
  # workflow so required checks still report. Documentation is root docs/ plus
  # the root agent instruction files (AGENTS.md, CLAUDE.md, CODEX.md and
  # GEMINI.md) while they still exist. Code that already passed is skipped too:
  # the fingerprint covers every tracked file outside docs/, counting only the
  # agent files' presence, so a rebase that only brings in documentation from
  # main reuses the earlier green run. A pull request's cache is scoped to that
  # request, so a push to main also reuses its merged pull request's run when
  # that run tested the same tree. Unknown bases, manual runs and failed
  # detection run CI.
  changes:
    runs-on: ubuntu-latest
    # Job permissions replace the defaults: checkout and the merge lookups read
    # contents, the merged pull request and its CI runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            # Include both sides of renames across the docs/ boundary.
            changed=$(git diff --no-renames --name-only "$base" HEAD)
            code_changed=$(git diff --no-renames --name-only "$base" HEAD -- . ':(top,exclude)docs/' \
              ':(top,exclude)AGENTS.md' ':(top,exclude)CLAUDE.md' ':(top,exclude)CODEX.md' ':(top,exclude)GEMINI.md')
            # A root agent file counts as documentation only while it exists:
            # added or modified. Deleting, renaming or retyping one is code,
            # because the skill sync requires the root AGENTS.md. Nested
            # AGENTS.md files are always code.
            agents_removed=$(git diff --no-renames --name-only --diff-filter=am "$base" HEAD -- \
              ':(top)AGENTS.md' ':(top)CLAUDE.md' ':(top)CODEX.md' ':(top)GEMINI.md')
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && [ -z "$code_changed$agents_removed" ]; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - name: Fingerprint the code under test
        id: fingerprint
        run: |
          set -euo pipefail
          # Mode, blob and path of every tracked file outside docs/. The root
          # agent instruction files keep their mode and path but not their
          # content, so adding or removing one changes the fingerprint and
          # editing one does not. For a pull request this is the merge result
          # that the tests would exercise.
          fingerprint=$(git -c core.quotePath=false ls-tree -r --full-tree HEAD |
            awk -F '\t' '
              $2 ~ /^docs\// { next }
              $2 == "AGENTS.md" || $2 == "CLAUDE.md" || $2 == "CODEX.md" || $2 == "GEMINI.md" {
                sub(/ [0-9a-f]+$/, " agent-instructions", $1); print $1 "\t" $2; next
              }
              { print }' |
            sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" | tee -a "$GITHUB_OUTPUT"
      - name: Look for an earlier green run of this exact code
        id: green
        if: steps.paths.outputs.code == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true
      - name: Reuse the merged pull request's green run
        id: merged
        if: github.event_name == 'push' && steps.paths.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Main requires up-to-date branches, so a squash merge lands the tree
          # its pull request's CI already passed. Reuse that run only when this
          # push adds one commit, the commit is a pull request's merge, the
          # request's final head contains the previous main and has this exact
          # tree, and CI passed on that head. Anything else, or any failed
          # lookup, runs every check.
          tested=false
          sha=$(git rev-parse HEAD)
          if [ -n "$BEFORE" ] && [ "$(git rev-parse --verify --quiet 'HEAD^' || true)" = "$BEFORE" ]; then
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq ".[] | select(.merge_commit_sha == \"$sha\") | \"\(.number) \(.head.sha)\"" 2>/dev/null | head -n 1 || true)
            number=${pr%% *}
            head=${pr##* }
            if [[ "$number" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
              git fetch --no-tags --quiet origin "refs/pull/$number/head" &&
              [ "$(git rev-parse FETCH_HEAD)" = "$head" ] &&
              git merge-base --is-ancestor "$BEFORE" "$head" &&
              [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              passed=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
              if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
                tested=true
                echo "Pull request #$number passed CI on $head, which has this exact tree."
              fi
            fi
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"
      - name: Decide what to skip
        id: plan
        env:
          CODE: ${{ steps.paths.outputs.code }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          MERGED: ${{ steps.merged.outputs.tested }}
        run: |
          set -euo pipefail
          skip=
          if [ "$CODE" = "false" ]; then skip=docs; elif [ "$GREEN" = "true" ] || [ "$MERGED" = "true" ]; then skip=tested; fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  # ADR-001 §9 / PLAN-005: test and package on each supported platform.
  # Keep required matrix names stable, but use only lightweight Ubuntu jobs to
  # acknowledge a skip: a documentation-only change, or code that already
  # passed, in an earlier run or in a main push's merged pull request. Tests run
  # `.ts` files directly through Node 24 type stripping, so the source stays
  # limited to erasable syntax.
  node:
    name: node (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip != '' && 'ubuntu-latest' || matrix.os }}
    env:
      SKIP: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Documentation-only change
        if: env.SKIP == 'docs'
        run: echo "Only docs/ or root agent instruction files (AGENTS.md, CLAUDE.md, CODEX.md, GEMINI.md) changed; install, typecheck, tests and packaging are skipped."
      - name: Already tested
        if: env.SKIP == 'tested'
        run: echo "This exact code outside docs/ and the agent instruction files already passed every required check, in an earlier run or in the merged pull request; install, typecheck, tests and packaging are skipped, and the candidate packages are in that run."
      - uses: actions/checkout@v4
        if: env.SKIP == ''

      - name: Use Node.js 24
        if: env.SKIP == ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: env.SKIP == ''
        run: npm ci

      - name: Typecheck
        if: env.SKIP == ''
        run: npm run typecheck

      - name: Test
        if: env.SKIP == ''
        run: npm test

      - name: Build
        if: env.SKIP == ''
        run: npm run build

      - name: Test real Electron relaunch
        if: env.SKIP == '' && matrix.os == 'ubuntu-latest'
        env:
          CATS_TEST_ELECTRON_RELAUNCH: '1'
        run: node --test tests/shell/linuxRelaunch.test.ts

      - name: Build candidate packages (updates disabled)
        if: env.SKIP == ''
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/build-preview.mjs --platform "$RELEASE_PLATFORM" --tag "$tag" --source "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: env.SKIP == ''
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/*-build.json
          if-no-files-found: error

  preview-contract:
    needs: [changes, node]
    if: ${{ !cancelled() && needs.node.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.skip == '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "runtime=$(node -p 'require("./vendor/runtime-source.json").commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: cats-inc/cats-runtime
          ref: ${{ steps.pin.outputs.runtime }}
          path: runtime-source
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete candidate assets and source bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/create-source-bundle.py "$SOURCE_COMMIT" runtime-source release-assets
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { validateInputs, validateAssets } from './scripts/release-contract.mjs';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const input = await validateInputs(process.cwd(), `v${pkg.version}`);
          await validateAssets('release-assets', input, process.env.SOURCE_COMMIT, true);
          JS

  validate:
    # This existing required check also gates every platform's package contract.
    needs: [changes, node, preview-contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the expected platform and package checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SKIP: ${{ needs.changes.outputs.skip }}
          NODE_RESULT: ${{ needs.node.result }}
          CONTRACT_RESULT: ${{ needs.preview-contract.result }}
        run: |
          set -euo pipefail
          test "$NODE_RESULT" = success
          if [ "$CHANGES_RESULT" = success ] && { [ "$SKIP" = docs ] || [ "$SKIP" = tested ]; }; then
            test "$CONTRACT_RESULT" = skipped
          else
            test "$CONTRACT_RESULT" = success
          fi
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate YAML files
        # Every tracked YAML file must parse; one parse error fails the job.
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import subprocess
          import sys

          import yaml

          listed = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8")
          paths = [path for path in listed.split("\0") if path]
          failures = 0
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as error:
                  failures += 1
                  print(f"Invalid: {path}: {error}", file=sys.stderr)
              else:
                  print(f"Valid: {path}")
          print(f"Checked {len(paths)} YAML file(s), {failures} invalid")
          sys.exit(1 if failures else 0)
          PY

      # Reached only when the gate and every check above passed, so all three
      # node legs, the package contract and this job succeeded on this code.
      # A skip, or a failed detection, records nothing.
      - name: Record this code as tested
        if: needs.changes.result == 'success' && needs.changes.outputs.skip == '' && needs.changes.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
        run: |
          mkdir -p .ci-green
          echo "$FINGERPRINT $GITHUB_RUN_ID" > .ci-green/marker

      - name: Save the tested marker
        if: needs.changes.result == 'success' && needs.changes.outputs.skip == '' && needs.changes.outputs.fingerprint != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ needs.changes.outputs.fingerprint }}
