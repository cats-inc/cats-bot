name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Match the other Cats repos: detect docs-only changes inside the workflow so
  # required checks still report. Unknown bases and failed detection run CI.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            # Include both sides of renames across the docs/ boundary.
            changed=$(git diff --no-renames --name-only "$base" HEAD)
            code_changed=$(git diff --no-renames --name-only "$base" HEAD -- . ':(top,exclude)docs/')
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && [ -z "$code_changed" ]; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # ADR-001 §9 / PLAN-005: test and package on each supported platform.
  # Keep required matrix names stable, but use only lightweight Ubuntu jobs for
  # docs-only acknowledgements. Tests run `.ts` files directly through
  # Node 24 type stripping, so the source stays limited to erasable syntax.
  node:
    name: node (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      DOCS_ONLY: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos
    steps:
      - name: Documentation-only change
        if: env.DOCS_ONLY == 'true'
        run: echo "Only docs/ changed; install, typecheck, tests and packaging are skipped."
      - uses: actions/checkout@v4
        if: env.DOCS_ONLY != 'true'

      - name: Use Node.js 24
        if: env.DOCS_ONLY != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: env.DOCS_ONLY != 'true'
        run: npm ci

      - name: Typecheck
        if: env.DOCS_ONLY != 'true'
        run: npm run typecheck

      - name: Test
        if: env.DOCS_ONLY != 'true'
        run: npm test

      - name: Build
        if: env.DOCS_ONLY != 'true'
        run: npm run build

      - name: Build candidate packages (updates disabled)
        if: env.DOCS_ONLY != 'true'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/build-preview.mjs --platform "$RELEASE_PLATFORM" --tag "$tag" --source "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: env.DOCS_ONLY != 'true'
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/*-build.json
          if-no-files-found: error

  preview-contract:
    needs: [changes, node]
    if: ${{ !cancelled() && needs.node.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "runtime=$(node -p 'require("./vendor/runtime-source.json").commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: cats-inc/cats-runtime
          ref: ${{ steps.pin.outputs.runtime }}
          path: runtime-source
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete candidate assets and source bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/create-source-bundle.py "$SOURCE_COMMIT" runtime-source release-assets
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { validateInputs, validateAssets } from './scripts/release-contract.mjs';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const input = await validateInputs(process.cwd(), `v${pkg.version}`);
          await validateAssets('release-assets', input, process.env.SOURCE_COMMIT, true);
          JS

  validate:
    # This existing required check also gates every platform's package contract.
    needs: [changes, node, preview-contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the expected platform and package checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NODE_RESULT: ${{ needs.node.result }}
          CONTRACT_RESULT: ${{ needs.preview-contract.result }}
        run: |
          set -euo pipefail
          test "$NODE_RESULT" = success
          if [ "$CHANGES_RESULT" = success ] && [ "$CODE" = false ]; then
            test "$CONTRACT_RESULT" = skipped
          else
            test "$CONTRACT_RESULT" = success
          fi
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate YAML files
        # Every tracked YAML file must parse; one parse error fails the job.
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import subprocess
          import sys

          import yaml

          listed = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8")
          paths = [path for path in listed.split("\0") if path]
          failures = 0
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as error:
                  failures += 1
                  print(f"Invalid: {path}: {error}", file=sys.stderr)
              else:
                  print(f"Valid: {path}")
          print(f"Checked {len(paths)} YAML file(s), {failures} invalid")
          sys.exit(1 if failures else 0)
          PY
