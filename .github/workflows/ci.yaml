name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ADR-001 §9 / PLAN-001 Task 0.3: the bot core is built and tested on both
  # platforms the first shell targets. Tests run `.ts` files directly through
  # Node 24 type stripping, so the source stays limited to erasable syntax.
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      - name: Set up Python for YAML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate YAML files
        # Every tracked YAML file must parse; one parse error fails the job.
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import subprocess
          import sys

          import yaml

          listed = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8")
          paths = [path for path in listed.split("\0") if path]
          failures = 0
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as error:
                  failures += 1
                  print(f"Invalid: {path}: {error}", file=sys.stderr)
              else:
                  print(f"Valid: {path}")
          print(f"Checked {len(paths)} YAML file(s), {failures} invalid")
          sys.exit(1 if failures else 0)
          PY
