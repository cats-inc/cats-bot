<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Cats Bot</title>
    <link rel="stylesheet" href="paw.css" />
    <link rel="stylesheet" href="floating.css" />
  </head>
  <body class="idle">
    <!-- SPEC-002 FR-7: the window is click-through except over the bubble and the cat. -->
    <div class="bubble" id="bubble" hidden>
      <button class="bubble-close" id="bubble-close" aria-label="Dismiss">×</button>
      <div class="bubble-from" id="bubble-from"></div>
      <div class="bubble-text" id="bubble-text"></div>
    </div>
    <div class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
    <div class="cat" id="cat" role="button" aria-label="Cats Bot">
      <!-- floating.ts draws the bot's look here (SPEC-008 FR-29). -->
      <div id="cat-art" aria-hidden="true"></div>
      <span class="badge" id="badge" hidden>0</span>
    </div>
    <script type="module" src="./floating.ts"></script>
  </body>
</html>
