<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.25 -5.25 132.5 132.5" color="#000">
  <!--
    macOS menu-bar template for the hub tray: the default Cat's head and ears from
    src/renderer/cat.svg as one solid silhouette, with the eyes, nose and mouth
    knocked out. macOS reads only the alpha and draws it in the menu bar's own
    colour, as it does Cats Desktop's template. The round head and the missing
    whiskers keep it distinct from Desktop's cat when both sit in the bar; the
    mouth stroke is thickened to survive 20pt. The viewBox makes the artwork as
    tall as Desktop's head on the same 20pt canvas.
    src/shell/electron/tray-icon.svg (Windows and Linux) nests this exact
    drawing; keep the two in sync. Regenerate with `npm run icons`.
  -->
  <defs>
    <mask id="tray-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <ellipse cx="44" cy="70" rx="9.5" ry="11.5" fill="#000"/>
      <ellipse cx="84" cy="70" rx="9.5" ry="11.5" fill="#000"/>
      <path d="M58 82 L70 82 L64 89 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
      <path d="M64 88 L64 91 M64 91 Q60 98 53 95 M64 91 Q68 98 75 95" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#tray-holes)" fill="currentColor">
    <path d="M22 54 L26 14 Q28 8 34 12 L58 32 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <path d="M106 54 L102 14 Q100 8 94 12 L70 32 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="64" cy="72" rx="48" ry="42"/>
  </g>
</svg>
