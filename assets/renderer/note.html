<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Cats Bot</title>
  <link rel="stylesheet" href="note.css">
</head>
<body>
  <header class="note-header" id="header">
    <span class="note-title" id="title">Cats Bot</span>
    <span class="note-unread" id="unread" hidden>0</span>
    <span class="note-state" id="state"></span>
    <span class="note-spacer"></span>
    <button class="note-button" id="settings" title="Settings and notes">⚙</button>
    <button class="note-button" id="pin" title="Keep on top" aria-pressed="false">📌</button>
    <button class="note-button" id="hide" title="Hide (the bot keeps running)">✕</button>
  </header>
  <main class="note-transcript" id="transcript" aria-live="polite"></main>
  <footer class="note-composer">
    <textarea id="input" rows="2" placeholder="Say something… (Enter to send, Shift+Enter for a new line)"></textarea>
    <div class="note-actions">
      <button class="note-send" id="send">Send</button>
      <button class="note-cancel" id="cancel" hidden>Cancel</button>
    </div>
  </footer>
  <script src="note.js"></script>
</body>
</html>
